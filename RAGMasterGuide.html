def timer(func: F) -> F:
    @functools.wraps(func)          # preserves __name__, __doc__, __wrapped__
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        result = func(*args, **kwargs)
        elapsed = (time.perf_counter() - start) * 1000
        logger.info(f"{func.__name__} took {elapsed:.2f}ms")

def retry(max_attempts: int = 3, delay: float = 1.0, exceptions: tuple = (Exception,)):
    """
    Decorator factory — outer function receives params,
    inner function wraps the target. Three nested levels.
    """
    def decorator(func: F) -> F:
        @functools.wraps(func)
        def wrapper(*args, **kwargs):
            last_exc = None
            for attempt in range(1, max_attempts + 1):
                try:
                    return func(*args, **kwargs)
                except exceptions as e:
                    last_exc = e
                    wait = delay * (2 ** (attempt - 1))   # exponential backoff
                    logger.warning(f"[{func.__name__}] attempt {attempt} failed: {e}. "
                                   f"Retry in {wait:.1f}s")
                    time.sleep(wait)
            raise RuntimeError(f"All {max_attempts} attempts failed") from last_exc
        return wrapper  # type: ignore
    return decorator

    """Class decorator that throttles calls per second."""
    def __init__(self, calls_per_sec: int):
        self.calls_per_sec = calls_per_sec
        self.min_interval = 1.0 / calls_per_sec
        self._last_call = 0.0

    def __call__(self, func: F) -> F:
        @functools.wraps(func)
        def wrapper(*args, **kwargs):
            elapsed = time.time() - self._last_call
            if elapsed < self.min_interval:
                time.sleep(self.min_interval - elapsed)
            self._last_call = time.time()
            return func(*args, **kwargs)
        return wrapper  # type: ignore

@contextmanager
def pipeline_timer(stage_name: str) -> Generator[dict, None, None]:
    """
    Yields a metrics dict. Code between yield is the 'with' body.

class AsyncRedisLock:
    """
    Distributed lock using Redis — prevents double-processing emails.
    async with → acquire lock, guaranteed release on exit.
    """
    def __init__(self, redis_client, lock_key: str, ttl: int = 30):
        self.redis = redis_client
        self.key = f"lock:{lock_key}"
        self.ttl = ttl

    async def __aenter__(self):
        # SET NX (set if not exists) with TTL — atomic Redis operation
        acquired = await self.redis.set(self.key, "1", nx=True, ex=self.ttl)
        if not acquired:
            raise RuntimeError(f"Could not acquire lock: {self.key}")
        print(f"Lock acquired: {self.key}")
        return self

    async def __aexit__(self, exc_type, exc_val, exc_tb):
        await self.redis.delete(self.key)   # always release
        print(f"Lock released: {self.key}")
        return False

    Cache embedding by hash of text.
    Cache hit: ~0.1ms. Miss: ~50ms API call.
    TTL: 24h (embeddings don't change unless model changes).

# ── 2. SEMANTIC CACHE (similar queries → same answer) ───────────────────────
# Using Redis + vector similarity to avoid re-calling LLM for similar Qs
class SemanticCache:
    """
    If query embedding is >0.95 cosine similar to a cached query,
    return cached answer. Saves ~60% LLM calls for FAQ-style queries.
    """
    def __init__(self, redis, model, threshold: float = 0.95):
        self.redis = redis
        self.model = model
        self.threshold = threshold

    async def get(self, query: str) -> str | None:
        import numpy as np
        q_emb = np.array(self.model.encode(query))
        keys = await self.redis.keys("semcache:*")
        for key in keys:
            cached = json.loads(await self.redis.get(key))
            cached_emb = np.array(cached["embedding"])
            # cosine similarity
            sim = float(np.dot(q_emb, cached_emb) /
                       (np.linalg.norm(q_emb) * np.linalg.norm(cached_emb)))
            if sim >= self.threshold:
                return cached["answer"]
        return None

    async def set(self, query: str, answer: str) -> None:
        q_emb = self.model.encode(query).tolist()
        key = f"semcache:{hashlib.sha256(query.encode()).hexdigest()[:12]}"
        await self.redis.setex(key, 3600, json.dumps({
            "query": query, "answer": answer, "embedding": q_emb
        }))

# ── 3. RATE LIMITER (sliding window) ────────────────────────────────────────
async def check_rate_limit(user_id: str, limit: int = 100, window_sec: int = 60) -> bool:
    """
    Sliding window rate limiter using Redis sorted set.
    O(log n) per operation. Accurate across distributed pods.
    """
    key = f"ratelimit:{user_id}"
    now = asyncio.get_event_loop().time()
    window_start = now - window_sec

    async with redis_client.pipeline() as pipe:
        pipe.zremrangebyscore(key, 0, window_start)  # remove old entries
        pipe.zadd(key, {str(now): now})               # add current request
        pipe.zcard(key)                               # count in window
        pipe.expire(key, window_sec)
        _, _, count, _ = await pipe.execute()

    return count <= limit   # True = allowed

    1. Retrieve → Generate → Self-assess → Retrieve more if needed.

Question: {query}
Answer: {answer_text}
Respond: 'complete' or 'needs_more: [specific gap]'"""

        context += "\\n\\n" + "\\n\\n".join(d.text for d in more_docs)

def top_k_chunks_heap(scored_chunks: list[tuple[float, str]], k: int) -> list[tuple[float, str]]:
    """
    Min-heap of size k: O(n log k) vs O(n log n) sort.

class DocumentStore:
    """
    HashMap: doc_id → document data. O(1) get/set/delete.
    Bloom filter: space-efficient "probably in set" check (no false negatives).
    """
    def __init__(self):

        self._seen_hashes: set[str] = set() # O(1) duplicate detection

    def add(self, doc_id: str, data: dict, content_hash: str) -> bool:

class AgentGraph:
    """
    Directed graph of agent dependencies.
    BFS: shortest path (min hops). DFS: all paths.
    Topological sort: valid execution order.
    """
    def __init__(self):
        self.adj: dict[str, list[str]] = defaultdict(list)

    def add_edge(self, u: str, v: str) -> None:
        self.adj[u].append(v)

    def bfs_shortest_path(self, start: str, end: str) -> list[str] | None:
        """O(V + E). Returns shortest execution path."""
        queue = deque([[start]])
        visited = {start}
        while queue:
            path = queue.popleft()
            node = path[-1]
            if node == end:
                return path
            for neighbour in self.adj[node]:
                if neighbour not in visited:
                    visited.add(neighbour)
                    queue.append(path + [neighbour])
        return None

    def topological_sort(self) -> list[str]:
        """Kahn's algorithm. Determines valid agent execution order. O(V+E)."""
        in_degree: dict[str, int] = defaultdict(int)
        nodes = set(self.adj.keys())
        for node in list(self.adj):
            for neighbour in self.adj[node]:
                in_degree[neighbour] += 1
                nodes.add(neighbour)

        queue = deque(n for n in nodes if in_degree[n] == 0)
        order = []
        while queue:
            node = queue.popleft()
            order.append(node)
            for neighbour in self.adj[node]:
                in_degree[neighbour] -= 1
                if in_degree[neighbour] == 0:
                    queue.append(neighbour)
        return order

def sliding_window_context(
    chunks: list[str],
    window_size: int = 5,
    stride: int = 2,
    max_tokens: int = 4096
) -> list[list[str]]:
    """
    Sliding window over retrieved chunks — ensures context fits LLM window.
    window_size=5: at most 5 chunks per LLM call.
    stride=2: each window overlaps previous by 3 chunks (context continuity).
    """
    windows = []
    for i in range(0, max(1, len(chunks) - window_size + 1), stride):
        window = chunks[i:i + window_size]
        token_count = sum(len(c.split()) * 1.3 for c in window)  # rough token estimate
        if token_count <= max_tokens:
            windows.append(window)
    return windows

def deduplicate_sorted_chunks(chunks: list[tuple[float, str]],
                              similarity_threshold: float = 0.95) -> list[tuple[float, str]]:
    """
    Two-pointer deduplication on sorted chunks.
    Removes near-duplicate retrieved chunks before sending to LLM.
    Simple Jaccard similarity as proxy for semantic similarity.
    """
    if not chunks:
        return []

    def jaccard(a: str, b: str) -> float:
        sa, sb = set(a.lower().split()), set(b.lower().split())
        return len(sa & sb) / len(sa | sb) if (sa | sb) else 0.0

    result = [chunks_sorted[0]]
    for i in range(1, len(chunks_sorted)):

        if all(jaccard(chunks_sorted[i][1], r[1]) < similarity_threshold for r in result):

    return result

    const sectionsViewTarget = document.getElementById("sectionsViewTarget");
    
    const heroLabelEl = document.getElementById("heroLabel");
    const heroTitleEl = document.getElementById("heroTitle");
    const heroSubtitleEl = document.getElementById("heroSubtitle");
    const moduleHeroSection = document.getElementById("moduleHeroSection");

    const prevModuleBtn = document.getElementById("prevModuleBtn");
    const nextModuleBtn = document.getElementById("nextModuleBtn");

    // INITIALIZATION RUNNER
    function init() {
      document.getElementById("totalModulesCount").innerText = MODULES.length;
      document.getElementById("totalSectionsCount").innerText = totalSectionsCount;

      buildSidebar();
      buildDotNavigation();
      renderActiveModule();

      // EVENT BINDINGS
      sidebarToggleBtn.addEventListener("click", () => {
        sidebarOpen = !sidebarOpen;
        if (sidebarOpen) {
          sidebarEl.classList.remove("hidden");
          sidebarToggleBtn.innerText = "←";
        } else {
          sidebarEl.classList.add("hidden");
          sidebarToggleBtn.innerText = "→";
        }
      });

      prevModuleBtn.addEventListener("click", () => navigateModule(-1));
      nextModuleBtn.addEventListener("click", () => navigateModule(1));
    }

    function buildSidebar() {
      moduleCardsContainer.innerHTML = "";
      MODULES.forEach(m => {
        const card = document.createElement("button");
        card.className = "module-card";
        card.setAttribute("id", `card-${m.id}`);
        card.addEventListener("click", () => switchModule(m.id));

        card.innerHTML = `
          <span class="mod-label" style="color: ${m.color}">${m.label}</span>
          <div class="mod-info">
            <div class="mod-title">${m.title}</div>
            <div class="mod-sub">${m.subtitle}</div>
          </div>
          <div class="active-dot" id="dot-${m.id}" style="background-color: ${m.color}; display: none;"></div>
        `;
        moduleCardsContainer.appendChild(card);
      });
    }

    function buildDotNavigation() {
      topDotNav.innerHTML = "";
      MODULES.forEach(m => {
        const dot = document.createElement("button");
        dot.className = "dot-indicator";
        dot.setAttribute("id", `indicator-${m.id}`);
        dot.setAttribute("title", m.title);
        dot.addEventListener("click", () => switchModule(m.id));
        topDotNav.appendChild(dot);
      });
    }

    function switchModule(id) {
      activeModuleId = id;
      renderActiveModule();
    }

    function navigateModule(direction) {
      const index = MODULES.findIndex(m => m.id === activeModuleId);
      const nextIndex = index + direction;
      if (nextIndex >= 0 && nextIndex < MODULES.length) {
        switchModule(MODULES[nextIndex].id);
      }
    }

    function renderActiveModule() {
      const mod = MODULES.find(m => m.id === activeModuleId);
      const sections = CONTENT[activeModuleId] || [];

      // Update Top Nav and Sidebar Highlight styles dynamically
      MODULES.forEach(m => {
        const card = document.getElementById(`card-${m.id}`);
        const dot = document.getElementById(`dot-${m.id}`);
        const indicator = document.getElementById(`indicator-${m.id}`);

        if (m.id === activeModuleId) {
          card.style.borderColor = m.color + "80";
          card.style.background = m.bg;
          card.style.boxShadow = `0 0 15px ${m.color}15`;
          dot.style.display = "block";
          indicator.style.backgroundColor = m.color;
          indicator.style.boxShadow = `0 0 8px ${m.color}`;
        } else {
          card.style.borderColor = "";
          card.style.background = "";
          card.style.boxShadow = "";
          dot.style.display = "none";
          indicator.style.backgroundColor = "";
          indicator.style.boxShadow = "";
        }
      });

      // Update Hero Section
      moduleHeroSection.style.background = `${mod.bg}ee`;
      heroLabelEl.innerText = mod.label;
      heroLabelEl.style.color = mod.color + "25";
      heroTitleEl.innerText = mod.title;
      heroSubtitleEl.innerText = mod.subtitle;
      heroSubtitleEl.style.color = mod.color + "cc";

      // Control dynamic header button logic
      prevModuleBtn.disabled = (activeModuleId === "m1");
      nextModuleBtn.disabled = (activeModuleId === `m${MODULES.length}`);

      // Render interior sections
      renderSectionsList(sections, mod.color);
      document.getElementById("contentContainer").scrollTop = 0;
    }

    function renderSectionsList(sections, accentColor) {
      sectionsViewTarget.innerHTML = "";
      if (sections.length === 0) {
        sectionsViewTarget.innerHTML = `<div class="text-slate-500 text-sm text-center" style="padding: 60px 0;">Content documentation offline.</div>`;
        return;
      }

      sections.forEach((sec, idx) => {
        const wrapper = document.createElement("div");
        wrapper.className = "section-wrapper";

        // Create Header trigger bar
        const trigger = document.createElement("button");
        trigger.className = "section-trigger";
        
        let arrowSymbol = document.createElement("span");
        arrowSymbol.className = "trigger-arrow";
        arrowSymbol.style.color = accentColor;
        arrowSymbol.innerText = "▶";

        const info = document.createElement("div");
        info.className = "trigger-info";
        
        const h3 = document.createElement("h3");
        h3.innerText = sec.title;
        info.appendChild(h3);

        const pillBox = document.createElement("div");
        pillBox.className = "pill-box";
        sec.concepts.forEach(con => {
          const pill = document.createElement("span");
          pill.className = "concept-pill";
          pill.style.borderColor = accentColor + "3a";
          pill.style.color = accentColor;
          pill.style.background = accentColor + "08";
          pill.innerText = con;
          pillBox.appendChild(pill);
        });
        info.appendChild(pillBox);

        trigger.appendChild(arrowSymbol);
        trigger.appendChild(info);

        // Content Area Container block
        const contentPanel = document.createElement("div");
        contentPanel.className = "section-content";

        const bodyText = document.createElement("p");
        bodyText.className = "section-body-text";
        bodyText.innerText = sec.body;
        contentPanel.appendChild(bodyText);

        // Code block constructor panels
        if (sec.code) {
          const codeContainer = document.createElement("div");
          codeContainer.className = "code-container";
          codeContainer.style.borderColor = accentColor + "25";

          const codeHeader = document.createElement("div");
          codeHeader.className = "code-header";
          codeHeader.style.background = "#090d16";
          codeHeader.style.borderBottomColor = accentColor + "15";

          codeHeader.innerHTML = `
            <div class="mac-dots">
              <div class="mac-dot" style="background-color: rgba(239, 68, 68, 0.4)"></div>
              <div class="mac-dot" style="background-color: rgba(245, 158, 11, 0.4)"></div>
              <div class="mac-dot" style="background-color: rgba(16, 185, 129, 0.4)"></div>
            </div>
          `;

          const copyBtn = document.createElement("button");
          copyBtn.className = "copy-btn";
          copyBtn.innerText = "copy";
          copyBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(sec.code);
            copyBtn.innerText = "✓ copied";
            copyBtn.style.color = "#4ade80";
            setTimeout(() => {
              copyBtn.innerText = "copy";
              copyBtn.style.color = "";
            }, 1500);
          });
          codeHeader.appendChild(copyBtn);

          const pre = document.createElement("pre");
          const codeNode = document.createElement("code");
          codeNode.innerText = sec.code;
          pre.appendChild(codeNode);

          codeContainer.appendChild(codeHeader);
          codeContainer.appendChild(pre);
          contentPanel.appendChild(codeContainer);
        }

        wrapper.appendChild(trigger);
        wrapper.appendChild(contentPanel);

        // Interactive panel expand toggle
        let isExpanded = false;
        trigger.addEventListener("click", () => {
          isExpanded = !isExpanded;
          if (isExpanded) {
            contentPanel.style.display = "block";
            arrowSymbol.innerText = "▼";
            wrapper.style.borderColor = accentColor + "40";
          } else {
            contentPanel.style.display = "none";
            arrowSymbol.innerText = "▶";
            wrapper.style.borderColor = "";
          }
        });

        sectionsViewTarget.appendChild(wrapper);
      });
    }

    // RUN BOOTSTRAPPER APP ENGINE
    window.onload = init;
  </script>
</body>
</html>
